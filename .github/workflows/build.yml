name: Build Game for All Platforms

# When to run this workflow
on:
  push:
    branches: [ production, cleanup-and-refactoring ]  # Run on pushes to these branches
  pull_request:
    branches: [ production ]  # Run on PRs to production
  workflow_dispatch:  # Allow manual triggering from GitHub UI

jobs:
  build:
    # Build matrix: run the job on 3 OSes x 2 profiles = 6 builds total
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        profile: [hw-accel, no-hw-accel]
        include:
          - os: ubuntu-latest
            artifact-name: Linux
          - os: windows-latest
            artifact-name: Windows
          - os: macos-latest
            artifact-name: macOS
          - profile: hw-accel
            profile-name: HardwareAccel
          - profile: no-hw-accel
            profile-name: SoftwareRenderer

    runs-on: ${{ matrix.os }}  # Which OS to run on

    steps:
      # Step 1: Download your code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Java 21 (required to build your game)
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'  # Eclipse Temurin JDK
          cache: 'maven'  # Cache Maven dependencies for faster builds

      # Step 3: Build the JAR and create the jpackage executable with the selected profile
      - name: Build with Maven (${{ matrix.profile-name }})
        run: mvn clean package jpackage:jpackage -P${{ matrix.profile }}

      # Step 4: Upload the built application as a downloadable artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Game-${{ matrix.artifact-name }}-${{ matrix.profile-name }}  # e.g., Game-Windows-HardwareAccel, Game-Linux-SoftwareRenderer
          path: target/dist/  # The jpackage output folder
          retention-days: 30  # Keep artifacts for 30 days
